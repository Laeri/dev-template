# Merged on top of the root docker-compose.yml (postgres + mailpit), so the
# project directory is the repo root and relative paths below start there.
services:
  app:
    build:
      context: .devcontainer
    command: sleep infinity
    volumes:
      - .:/workspace:cached
      # Keep the container's node_modules apart from the host's: pnpm refuses
      # to reuse a node_modules tree that was linked from a different store.
      - node-modules-root:/workspace/node_modules
      - node-modules-web:/workspace/apps/web/node_modules
      - node-modules-api:/workspace/packages/api/node_modules
      - node-modules-eslint-config:/workspace/packages/eslint-config/node_modules
      - node-modules-typescript-config:/workspace/packages/typescript-config/node_modules
      - pnpm-store:/home/node/.local/share/pnpm/store
    environment:
      # Real env vars win over apps/web/.env (Next.js and drizzle-kit both use
      # @next/env, which never overrides existing variables).
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    depends_on:
      - postgres
      - mailpit

  # Don't publish to the host; VS Code forwards the ports it needs. This also
  # avoids clashing with `docker compose up` run from the host.
  postgres:
    ports: !reset []
  mailpit:
    ports: !reset []

volumes:
  node-modules-root:
  node-modules-web:
  node-modules-api:
  node-modules-eslint-config:
  node-modules-typescript-config:
  pnpm-store:
